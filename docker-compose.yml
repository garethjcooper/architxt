services:
  architxt:
    build:
      context: .
      dockerfile: Dockerfile
    image: architxt:0.4.2
    container_name: architxt
    ports:
      - "3000:3000"
    env_file:
      # Create server/.env from server/.env.example before first run.
      # This file is NOT committed to git.
      - server/.env
    environment:
      # Override paths so data is written inside the container under a single mount point.
      # If you prefer to keep data next to the project, change these back to the defaults
      # and update the volume paths below.
      ARCHITXT_DB_PATH: /app/server/database/architxt.db
      ARCHITXT_STORAGE_PATH: /app/server/documents
      ARCHITXT_LOG_DIR: /app/server/logs
      ARCHITXT_TEMP_DIR: /app/server/tmp
      ARCHITXT_HOST: 0.0.0.0
      # When the docling profile is active, architxt talks to the docling service
      # by its compose network name instead of localhost.
      DOCLING_SERVICE_URL: http://docling:5001
      # NOTE: Set ARCHITXT_HINDSIGHT_DEFAULT_URL and ARCHITXT_HINDSIGHT_DEFAULT_BANK
      # in server/.env so they are picked up by the env_file above. Defining them
      # here with empty defaults would override the env_file values.
    volumes:
      - architxt-database:/app/server/database
      - architxt-documents:/app/server/documents
      - architxt-logs:/app/server/logs
      - architxt-tmp:/app/server/tmp
    restart: unless-stopped
    depends_on:
      docling:
        condition: service_started
        required: false
      hindsight:
        condition: service_healthy
        required: false
    # Give the server + daemons time to shut down cleanly (default is 10s)
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => { if (!r.ok) throw new Error('not ok'); process.exit(0) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Docling document-conversion service.
  # Active with: docker compose --profile docling up --build
  # Also activated automatically by the hindsight profile.
  docling:
    profiles:
      - docling
      - hindsight
    container_name: architxt-docling
    build:
      context: .
      dockerfile: docling.Dockerfile
    env_file:
      - server/.env
    environment:
      # The UI is not needed for the architxt pipeline.
      DOCLING_SERVE_ENABLE_UI: "false"
      # Default 20-minute sync wait. Override via shell or a root .env file:
      #   export DOCLING_SERVE_MAX_SYNC_WAIT=2400
      # Docker Compose does not read server/.env for variable interpolation.
      DOCLING_SERVE_MAX_SYNC_WAIT: "${DOCLING_SERVE_MAX_SYNC_WAIT:-1200}"
    command:
      - /bin/sh
      - -c
      - |
        pip install --no-cache-dir rapidocr_onnxruntime && \
        docling-serve run --host 0.0.0.0 --port 5001
    expose:
      - "5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Hindsight agent-memory service with the embedded pg0 database.
  # Active with: docker compose --profile hindsight up --build
  hindsight:
    profiles:
      - hindsight
    container_name: architxt-hindsight
    image: ghcr.io/vectorize-io/hindsight:latest
    env_file:
      - server/.env
    ports:
      - "8888:8888"
      - "9999:9999"
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  architxt-database:
  architxt-documents:
  architxt-logs:
  architxt-tmp:
  hindsight-data:
